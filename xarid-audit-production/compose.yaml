services:
  tenderai:
    container_name: tenderai-production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
